---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.1
  name: vdiinstances.vdi.desku.be
spec:
  group: vdi.desku.be
  names:
    kind: VdiInstance
    listKind: VdiInstanceList
    plural: vdiinstances
    singular: vdiinstance
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.address
      name: Address
      type: string
    - jsonPath: .status.sessionState
      name: Session
      type: string
    - jsonPath: .spec.owner
      name: Owner
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: VdiInstance is a streamed virtual desktop.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: VdiInstanceSpec defines one desktop for one owner.
            properties:
              expose:
                description: ExposeSpec controls the Service in front of the desktop.
                properties:
                  basePort:
                    description: |-
                      BasePort pins the Sunshine base port. Allocated when empty.
                      Moonlight derives the other ports from it: -5, +1, +9, +10, +11, +21.
                    format: int32
                    maximum: 65514
                    minimum: 1029
                    type: integer
                  host:
                    description: Host overrides the address reported to clients, for
                      example a DNS name.
                    type: string
                  type:
                    default: NodePort
                    description: ExposeType selects how the stream reaches the client.
                    enum:
                    - NodePort
                    - LoadBalancer
                    type: string
                type: object
              image:
                description: ImageSource is the golden image a desktop boots from.
                properties:
                  dataSource:
                    description: DataSourceRef names a CDI DataSource holding a prepared
                      desktop disk.
                    properties:
                      name:
                        type: string
                      namespace:
                        description: Namespace defaults to the instance namespace.
                        type: string
                    required:
                    - name
                    type: object
                  size:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 30Gi
                    description: Size of the root disk. Cannot be smaller than the
                      image.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                required:
                - dataSource
                type: object
              instanceType:
                default: u1.xlarge
                description: InstanceType is a VirtualMachineClusterInstancetype name.
                type: string
              owner:
                description: Owner is the Kubernetes user allowed to read this instance
                  and pair clients.
                type: string
              preference:
                default: fedora
                description: Preference is a VirtualMachineClusterPreference name.
                type: string
              running:
                default: true
                description: Running is the desired power state.
                type: boolean
              sshAuthorizedKeys:
                description: SSHAuthorizedKeys are installed for the admin user in
                  the guest.
                items:
                  type: string
                type: array
              stream:
                description: StreamSpec is passed into the Sunshine config inside
                  the guest.
                properties:
                  capture:
                    default: x11
                    enum:
                    - x11
                    - kms
                    - wlr
                    - kwin
                    type: string
                  encoder:
                    default: software
                    enum:
                    - software
                    - vaapi
                    - nvenc
                    - quicksync
                    - amdvce
                    - vulkan
                    type: string
                type: object
            required:
            - image
            type: object
          status:
            description: VdiInstanceStatus reports what a client needs to connect.
            properties:
              address:
                description: Address is what to type in Moonlight, host:port.
                type: string
              adminSecret:
