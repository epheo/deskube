apiVersion: vdi.desku.be/v1alpha1
kind: VdiInstance
metadata:
  name: problematic-vdi-example
  namespace: default
  annotations:
    description: "Example of a VDI instance with error conditions"
spec:
  provisionSource: Direct
  kubeVirtVMRef:
    name: nonexistent-vm  # Intentionally referencing a VM that doesn't exist
    namespace: vms
  sunshineConfig:
    fps: 60
    bitrate: 50
    resolution: "1920x1080"
  networkConfig:
    serviceType: ClusterIP
    exposureMethod: Ingress
    hostname: "problematic.vdi.example.com"
    tls: true
---
# Example of what kubectl get would return after reconciliation
