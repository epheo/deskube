apiVersion: vdi.desku.be/v1alpha1
kind: VdiInstance
metadata:
  name: alice-desk
spec:
  # Image, resources, home and idle timeout come from the class.
  className: desktop
  owner: alice
  # Moonlight shows a PIN when you add the desktop's address. Put it here
  # instead of typing it inside the desktop; the operator removes it once
  # the pairing succeeded or failed, and status.pairing says which.
  # pairing:
  #   pin: "1234"
  #   clientName: laptop
