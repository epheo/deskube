apiVersion: vdi.desku.be/v1alpha1
kind: VdiInstance
metadata:
  name: gaming-desktop-with-conditions
  namespace: default
  annotations:
    description: "Example VDI instance showing conditions usage"
spec:
  provisionSource: Direct
  kubeVirtVMRef:
    name: gaming-vm
    namespace: vms
  sunshineConfig:
    fps: 120
    bitrate: 80  # High bitrate for gaming
    resolution: "2560x1440"
    additionalOptions:
      adaptive-sync: "enabled"
      hdr: "enabled"
  networkConfig:
    serviceType: ClusterIP
    exposureMethod: Ingress
    hostname: "gaming.vdi.example.com"
    tls: true
  userAccess:
  - type: user
    name: "gamer1"
    permissions:
    - "connect"
    - "configure"
  - type: user
    name: "gamer2" 
    permissions:
    - "connect"
  accessControl:
    enabled: true
    createRoles: true
    rolePrefix: "gaming-vdi"
  resources:
    sunshine:
      limits:
        cpu: "4"
        memory: "4Gi"
      requests:
        cpu: "2"
        memory: "2Gi"
---
