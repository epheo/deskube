apiVersion: vdi.desku.be/v1alpha1
kind: VdiInstance
metadata:
  labels:
    app.kubernetes.io/name: vdiinstance
    app.kubernetes.io/instance: vdiinstance-rbac-sample
    app.kubernetes.io/part-of: desku.be
    app.kubernetes.io/managed-by: kustomize
  name: vdiinstance-rbac-sample
spec:
  kubeVirtVMRef:
    name: windows10-vm
    namespace: default
  
  # Configuration for Sunshine streaming server
  sunshineConfig:
    image: lizardbyte/sunshine:latest
    fps: 60
    resolution: 1920x1080
    bitrate: 50
    additionalOptions:
      audio: true
  
  # RBAC-based access control
  accessControl:
    enabled: true
    createRoles: true
    rolePrefix: vdi
    defaultRoleRef:
      kind: Role
      name: vdi-vdiinstance-rbac-sample-viewer
  
  # Define who can access this VDI instance
  userAccess:
  - type: user
    name: admin
    roleRef:
      kind: Role
      name: vdi-vdiinstance-rbac-sample-admin
  - type: group
    name: developers
    roleRef:
      kind: Role
      name: vdi-vdiinstance-rbac-sample-user
  - type: serviceaccount
    name: cicd-pipeline
    roleRef:
      kind: Role
      name: vdi-vdiinstance-rbac-sample-user
  
  # Resource requirements for VDI components
  resources:
    sunshine:
      limits:
        memory: 2Gi
        cpu: 2
      requests:
        memory: 1Gi
        cpu: 1
  
  # Network configuration
  networkConfig:
    serviceType: ClusterIP
    exposureMethod: Ingress
    hostname: vdi.example.com
    port: 47989
    tls: true
