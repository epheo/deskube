# Prometheus Monitor Service (Metrics)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: deskube
    app.kubernetes.io/managed-by: kustomize
  name: controller-manager-metrics-monitor
  namespace: system
spec:
  endpoints:
    - path: /metrics
      port: https
      scheme: https
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        # The manager signs its metrics certificate itself at start: no CA
        # can verify it. Cost: whoever sits between Prometheus and the
        # manager can read the token Prometheus sends.
        insecureSkipVerify: true
  selector:
    matchLabels:
      control-plane: controller-manager
