# permissions for end users to edit vditemplates.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clusterrole
    app.kubernetes.io/instance: vditemplate-editor-role
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: deskube
    app.kubernetes.io/part-of: deskube
    app.kubernetes.io/managed-by: kustomize
  name: vditemplate-editor-role
rules:
- apiGroups:
  - vdi.desku.be
  resources:
  - vditemplates
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - vdi.desku.be
  resources:
  - vditemplates/status
  verbs:
  - get
