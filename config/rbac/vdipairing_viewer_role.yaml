# permissions for end users to viewer vdipairings.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: deskube
    app.kubernetes.io/managed-by: kustomize
  name: vdipairing-viewer-role
rules:
- apiGroups:
  - vdi.desku.be
  resources:
  - vdipairings
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - vdi.desku.be
  resources:
  - vdipairings/status
  verbs:
  - get
