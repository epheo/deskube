# permissions for end users to edit vdipairings.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: deskube
    app.kubernetes.io/managed-by: kustomize
  name: vdipairing-editor-role
rules:
- apiGroups:
  - vdi.desku.be
  resources:
  - vdipairings
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - vdi.desku.be
  resources:
  - vdipairings/status
  verbs:
  - get
