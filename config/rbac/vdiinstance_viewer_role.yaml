# permissions for end users to view vdiinstances.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: deskube
    app.kubernetes.io/managed-by: kustomize
  name: vdiinstance-viewer-role
rules:
- apiGroups:
  - vdi.desku.be
  resources:
  - vdiinstances
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - vdi.desku.be
  resources:
  - vdiinstances/status
  verbs:
  - get
