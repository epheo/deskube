# permissions for admins to edit vdiclasses.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: deskube
    app.kubernetes.io/managed-by: kustomize
  name: vdiclass-editor-role
rules:
- apiGroups:
  - vdi.desku.be
  resources:
  - vdiclasses
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
