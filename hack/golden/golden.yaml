# Golden image cloned from the proof VM disk after cloud-init clean.
# cloneType snapshot uses a thin LVM snapshot instead of an 11 minute copy.
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: deskube-fedora-xfce
  annotations:
    cdi.kubevirt.io/cloneType: snapshot
    # WaitForFirstConsumer storage never populates a standalone volume.
    cdi.kubevirt.io/storage.bind.immediate.requested: "true"
spec:
  source:
    pvc:
      name: desk-proof-root
      namespace: deskube-dev
  storage:
    resources:
      requests:
        storage: 30Gi
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataSource
metadata:
  name: deskube-fedora-xfce
spec:
  source:
    pvc:
      name: deskube-fedora-xfce
      namespace: deskube-dev
