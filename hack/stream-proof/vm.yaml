apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: desk-proof
  labels:
    app: desk-proof
spec:
  runStrategy: Always
  instancetype:
    kind: VirtualMachineClusterInstancetype
    name: u1.xlarge
  preference:
    kind: VirtualMachineClusterPreference
    name: fedora
  dataVolumeTemplates:
    - metadata:
        name: desk-proof-root
      spec:
        sourceRef:
          kind: DataSource
          name: fedora
          namespace: openshift-virtualization-os-images
        storage:
          resources:
            requests:
              storage: 30Gi
  template:
    metadata:
      labels:
        app: desk-proof
    spec:
      domain:
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: desk-proof-root
        - name: cloudinitdisk
          cloudInitNoCloud:
            secretRef:
              name: desk-proof-cloudinit
---
apiVersion: v1
kind: Service
metadata:
  name: desk-proof
  labels:
    app: desk-proof
spec:
  type: NodePort
  selector:
    app: desk-proof
  ports:
    - name: https
      port: 31984
      nodePort: 31984
      protocol: TCP
    - name: http
      port: 31989
      nodePort: 31989
      protocol: TCP
    - name: web
      port: 31990
      nodePort: 31990
      protocol: TCP
    - name: rtsp
      port: 32010
      nodePort: 32010
      protocol: TCP
    - name: video
      port: 31998
      nodePort: 31998
      protocol: UDP
    - name: control
      port: 31999
      nodePort: 31999
      protocol: UDP
    - name: audio
      port: 32000
      nodePort: 32000
      protocol: UDP
